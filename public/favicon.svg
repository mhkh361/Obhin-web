<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#38BDF8" flood-opacity="0.4" />
    </filter>
  </defs>
  {/* Dark Circular Base with subtle border */}
  <circle cx="16" cy="16" r="15" fill="#080808" stroke="url(#brandGrad)" stroke-width="1.2" />
  
  {/* Prismatic Hexagonal Crystal */}
  <polygon
    points="16,6 25,11 25,21 16,26 7,21 7,11"
    stroke="url(#brandGrad)"
    stroke-width="1.4"
    fill="none"
    filter="url(#glow)"
  />
  
  {/* Inner Core Refraction Axes */}
  <path
    d="M16 6L16 26M7 11L25 21M7 21L25 11"
    stroke="#38BDF8"
    stroke-width="0.8"
    stroke-opacity="0.6"
  />
  
  {/* Radiant Core Singularity */}
  <circle cx="16" cy="16" r="2.2" fill="#FFFFFF" />
  <circle cx="16" cy="16" r="4" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.8" />
</svg>

